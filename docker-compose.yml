version: "3.8"

services:
  navidrome:
    image: deluan/navidrome:0.64.2
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "10029:4533"
    volumes:
      - "./data:/data"
      - "./music:/music:ro"
    environment:
      - TZ=Asia/Shanghai
      - ND_MUSICFOLDER=/music
      - ND_DATAFOLDER=/data
      - ND_PORT=4533
    healthcheck:
      test: ["CMD-SHELL", "(command -v curl >/dev/null && curl -fsS http://localhost:4533/ping) || (command -v wget >/dev/null && wget -q -O /dev/null http://localhost:4533/ping) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

x-app-meta:
  web:
    port: 10029
    protocol: http
